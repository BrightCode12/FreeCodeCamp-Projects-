<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Form Validation</title>
        <link rel="stylesheet" href="form.css">
    </head>
    <body>
        <form action="" id="main-ctn">
            <icon></icon>
            <h2>Create Your Account</h2>
            <h3>Practice Form Validation with JavaScript Regex</h3>
            <label for="username">
                Username
                <input
                    type="text"
                    id="username"
                    placeholder="e.g BrightCode12"
                />
                <div class="text-instr">
                    4-16 charcters: begin with a letter
                </div>
            </label>
            <label for="email">
                Email
                <input
                    type="email"
                    id="email"
                    placeholder="learner@example.com"
                />
                <div class="text-instr"></div>
            </label>

            <label for="phone-number">
                Phone number
                <input type="tel" id="phone-number" placeholder="08126111282" />
                <div class="text-instr">Excerise rule: exacly 11 digit</div>
            </label>
            <label for="Pin">
                Four-digit PIN
                <input type="number" id="Pin" placeholder="1234" />
                <div class="text-instr"></div>
            </label>
            <label for="password">
                Password
                <input
                    type="password"
                    id="password"
                    placeholder="Create a Password"
                />
                <div class="text-instr">
                    At least 8 charcters, with uppercase, lowercase and a digit
                </div>
            </label>
            <label for="confirm-password">
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Enter your password again"
                />
            </label>
        </form>
        <button type="submit" id="validate-btn">Validate Form</button>
        <script src="form.js"></script>
    </body>
</html>
