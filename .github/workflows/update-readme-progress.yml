name: Update README progress

on:
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - "scripts/update_readme_progress.py"
      - ".github/workflows/update-readme-progress.yml"

permissions:
  contents: write

jobs:
  update-progress:
    # Avoid running again for the commit made by this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Calculate overall and project progress
        run: python scripts/update_readme_progress.py

      - name: Commit recalculated README progress
        run: |
          if git diff --quiet -- README.md; then
            echo "README progress is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README project progress"
          git push
