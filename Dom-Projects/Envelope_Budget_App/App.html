<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Envelope Budgeter</title>
        <link rel="stylesheet" href="App.css">
	</head>

	<body>
		<div class="container">
			<form action="" id="budget-form">
				<label for="income">Total Monthly Income</label>
				<input
					type="text"
					id="income"
					type="number"
					min="0"
					placeholder="e.g. 2000"
					required
				/>
				<fieldset id="rent">
					<legend>Rent</legend>
					<label for="rent-amount">Amount</label>
					<input
						type="number"
						id="rent-amount"
						min="0"
						placeholder="e.g. 1000"
					/>
				</fieldset>
				<fieldset id="food">
					<legend>Food</legend>
					<div class="input-container"></div>
				</fieldset>
				<fieldset id="utilities">
					<legend>Utilities</legend>
					<div class="input-container"></div>
				</fieldset>
				<fieldset id="entertainment">
					<legend>Entertainment</legend>
					<div class="input-container"></div>
				</fieldset>
				<div class="controls">
					<span>
						<label for="entry-dropdown"> Add expense to: </label>
						<select id="entry-dropdown" name="options">
							<option value="food" selected>Food</option>
							<option value="utilities">Utilities</option>
							<option value="entertainment">Entertainment</option>
						</select>
						<button id="add-entry" type="button">Add Entry</button>
					</span>
				</div>
                <div>
                    <button type="submit">Calculate Remaining Budget</button>
                    <button type="button" id="clear">Clear</button>
                </div>
			</form>
            <div id="output" class="output hide"></div>
		</div>
        <script src="App.js"></script>
	</body>
</html>
